name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # required for all jobs
      actions: read
      contents: read
      # required for all jobs
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
          - language: python
          - language: actions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          config: |
            paths-ignore:
              - lab5/sdekit

      # Compile-only pass over the first-party lab exercises so the
      # CodeQL C/C++ extractor sees every translation unit. The lab
      # Makefiles are per-exercise (`make exN`), so there is no
      # build-all target to invoke. lab5/sdekit is a vendored Intel
      # SDE / libdwarf toolkit with its own build systems and is not
      # first-party code; it is intentionally not compiled here.
      - name: Build lab exercises (C/C++)
        if: matrix.language == 'c-cpp'
        run: |
          set -u
          mkdir -p /tmp/osds-obj
          fails=0
          for f in lab*/*.c; do
            [ -e "$f" ] || continue
            obj="/tmp/osds-obj/$(echo "$f" | tr / _).o"
            if ! gcc -c -w -Wno-implicit-function-declaration -Wno-implicit-int -Wno-int-conversion -Wno-incompatible-pointer-types -fno-stack-protector -g "$f" -o "$obj"; then
              # lab3/lab4 targets that their own Makefiles build with
              # -mgeneral-regs-only (no_caller_saved_registers attribute)
              if ! gcc -c -w -Wno-implicit-function-declaration -Wno-implicit-int -Wno-int-conversion -Wno-incompatible-pointer-types -mgeneral-regs-only -fno-stack-protector -g "$f" -o "$obj"; then
                echo "ERROR: failed to compile $f" >&2
                fails=$((fails + 1))
              fi
            fi
          done
          for f in lab*/*.cpp; do
            [ -e "$f" ] || continue
            obj="/tmp/osds-obj/$(echo "$f" | tr / _).o"
            if ! g++ -c -w -fpermissive -fno-stack-protector -g "$f" -o "$obj"; then
              echo "ERROR: failed to compile $f" >&2
              fails=$((fails + 1))
            fi
          done
          compiled=$(find /tmp/osds-obj -name '*.o' | wc -l)
          echo "compiled objects: $compiled (failures: $fails)"
          if [ "$fails" -ne 0 ] || [ "$compiled" -lt 20 ]; then
            echo "Build step failed or extracted too little" >&2
            exit 1
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
